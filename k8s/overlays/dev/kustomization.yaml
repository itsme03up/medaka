apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: web
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports/0/port
        value: 80
      - op: replace
        path: /spec/ports/0/targetPort
        value: 80
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080

  - target:
      kind: Service
      name: api
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: replace
        path: /spec/ports/0/port
        value: 8000
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8000
      - op: add
        path: /spec/ports/0/nodePort
        value: 30800
