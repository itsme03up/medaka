app = "medaka-api"

[build]
  context = ".."                 # ★ ルートをコンテキストに
  dockerfile = "Dockerfile"  # ★ ルートからの相対パスでOK

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 25
    hard_limit = 50

  [[http_service.checks]]
    interval = "10s"
    timeout  = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
